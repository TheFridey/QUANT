name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odin
          POSTGRES_PASSWORD: odin
          POSTGRES_DB: odin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odin -d odin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://odin:odin@127.0.0.1:5432/odin_test
      DATABASE_URL_TEST: postgresql://odin:odin@127.0.0.1:5432/odin_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-jwt-secret-not-for-production
      ADMIN_EMAIL: admin@odin.local
      ADMIN_PASSWORD: odin-paper-dev
      WEB_ORIGIN: http://127.0.0.1:4317
      DATA_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap gcc
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          bwrap --version
          bwrap --unshare-user --unshare-net --die-with-parent --uid 65534 --gid 65534 --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev --clearenv -- /usr/bin/true || echo "bwrap probe failed; generated-code tests will skip"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
