name: ci

# Audit L8: run on pull requests and pushes to main only; read-only token; one run per ref.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odin
          POSTGRES_PASSWORD: odin
          POSTGRES_DB: odin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odin -d odin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://odin:odin@127.0.0.1:5432/odin_test
      DATABASE_URL_TEST: postgresql://odin:odin@127.0.0.1:5432/odin_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-jwt-secret-not-for-production
      ADMIN_EMAIL: admin@odin.local
      ADMIN_PASSWORD: odin-paper-dev
      WEB_ORIGIN: http://127.0.0.1:4317
      DATA_MODE: live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap gcc
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          bwrap --version
          bwrap --unshare-user --unshare-net --die-with-parent --uid 65534 --gid 65534 --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev --clearenv -- /usr/bin/true || echo "bwrap probe failed; generated-code tests will skip"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      # Production-shaped compile (packages + api/worker/web). Does not install Playwright browsers.
      - name: Production build
        run: pnpm build

  # Browser E2E against a real api+worker+web stack with the deterministic PAPER feed (no public market network).
  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odin
          POSTGRES_PASSWORD: odin
          POSTGRES_DB: odin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odin -d odin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://odin:odin@127.0.0.1:5432/odin_e2e
      DATABASE_URL_TEST: postgresql://odin:odin@127.0.0.1:5432/odin_e2e
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-jwt-secret-not-for-production
      ADMIN_EMAIL: admin@odin.local
      ADMIN_PASSWORD: odin-paper-dev
      WEB_ORIGIN: http://127.0.0.1:4317
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4318
      EXECUTION_MODE: PAPER
      LIVE_MONEY_ENABLED: "false"
      ODIN_MARKET_FEED: deterministic
      ODIN_DETERMINISTIC_STEP_MS: "5000"
      DATA_MODE: live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create e2e database and migrate
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=odin psql -h 127.0.0.1 -U odin -d odin -tc "SELECT 1 FROM pg_database WHERE datname='odin_e2e'" | grep -q 1 \
            || PGPASSWORD=odin psql -h 127.0.0.1 -U odin -d odin -c "CREATE DATABASE odin_e2e"
          pnpm db:deploy
      - name: Build packages and apps
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @odin/web exec playwright install --with-deps chromium
      - name: Start api, worker, web
        run: |
          set -e
          test -f apps/api/dist/src/main.js
          test -f apps/worker/dist/src/main.js
          pnpm --filter @odin/api start > /tmp/odin-api.log 2>&1 &
          echo $! > /tmp/odin-api.pid
          pnpm --filter @odin/worker start > /tmp/odin-worker.log 2>&1 &
          echo $! > /tmp/odin-worker.pid
          pnpm --filter @odin/web start > /tmp/odin-web.log 2>&1 &
          echo $! > /tmp/odin-web.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4318/api/health >/dev/null 2>&1 \
              && curl -sf http://127.0.0.1:4317 >/dev/null 2>&1 \
              && kill -0 "$(cat /tmp/odin-worker.pid)" 2>/dev/null; then
              echo "stack ready after ${i}s"
              exit 0
            fi
            # Fail fast if api/worker crashed during boot.
            if grep -Eq "Cannot find module|failed to start|Unique constraint failed" /tmp/odin-api.log /tmp/odin-worker.log 2>/dev/null; then
              echo "api or worker failed to start"
              break
            fi
            sleep 1
          done
          echo "=== api ==="; tail -n 120 /tmp/odin-api.log || true
          echo "=== worker ==="; tail -n 120 /tmp/odin-worker.log || true
          echo "=== web ==="; tail -n 120 /tmp/odin-web.log || true
          exit 1
      - name: Playwright Gate 1 browser suite
        run: pnpm --filter @odin/web test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            /tmp/odin-*.log
          if-no-files-found: ignore

  # Optional compile-only job without DB services (packages + apps). No Playwright.
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages and apps
        run: pnpm build
        env:
          # Next may read these at build time; values are non-secret CI placeholders.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4318
